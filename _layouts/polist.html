---
layout: default
---

<article>
  {{ content }}
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span>
      <h3><a href="{{ post.url }}">{{ post.title | escape }}</a></h3>
    </li>
    {% endfor %}
  </ul>
</article>
